<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Centre Design Knowledge Check</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; }
        #quiz-container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); font-size: 24px; margin-bottom: 10px; border-bottom: 2px solid var(--secondary); padding-bottom: 10px; }
        .question { font-weight: 600; margin-bottom: 20px; color: #333; line-height: 1.5; }
        .option { display: block; width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; text-align: left; background: white; transition: 0.3s; font-size: 16px; }
        .option:hover { border-color: var(--secondary); background: #f0f8ff; }
        .correct { background-color: var(--success) !important; color: white; border-color: var(--success); }
        .wrong { background-color: var(--error) !important; color: white; border-color: var(--error); }
        #feedback { margin-top: 20px; font-weight: bold; padding: 15px; border-radius: 8px; display: none; }
        #next-btn { background: var(--secondary); color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; float: right; display: none; margin-top: 10px; }
        #next-btn:hover { background: #2980b9; }
        .progress { font-size: 14px; color: #7f8c8d; margin-bottom: 20px; }
        #score-screen { text-align: center; display: none; }
        .restart-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="quiz-content">
        <h1>Knowledge Check: Learning Centre Design</h1>
        <div class="progress" id="progress">Question 1 of 5</div>
        <div class="question" id="question-text"></div>
        <div id="options-container"></div>
        <div id="feedback"></div>
        <button id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="score-screen">
        <h1>Quiz Complete!</h1>
        <p id="final-score"></p>
        <button class="restart-btn" onclick="location.reload()">Restart Quiz</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "According to the principle of Juxtaposition, where should 'active, noisier centres' be placed?",
            options: ["Next to the quiet book area", "Close together, away from quieter zones", "Scattered randomly throughout the room", "In the center of the room by the entrance"],
            correct: 1,
            info: "Identification of play zones allows noisy social play to occur away from quiet areas."
        },
        {
            q: "Which types of centres should usually be adjacent to each other based on the 'Clean vs. Messy' principle?",
            options: ["Books, Blocks, and Art", "Math, Nap area, and Water play", "Creative Arts, Sensory, and Science Discovery", "Pathways and Storage units"],
            correct: 2,
            info: "Messy centres like Art, Sensory, and Science are grouped to keep clean areas (like carpeted book nooks) protected."
        },
        {
            q: "Why is portable storage (on wheels) recommended for learning centres?",
            options: ["It is cheaper than built-in units", "It prevents children from reaching materials", "It allows for flexibility in room arrangement and boundaries", "It makes cleaning the floors faster"],
            correct: 2,
            info: "Wheeled storage allows educators to alter boundaries and adapt the space to children's changing needs."
        },
        {
            q: "A classroom with a Southern exposure receives what type of light?",
            options: ["The largest amount of natural light during the day", "Brightness in the morning only", "Brightness in the late afternoon only", "No natural light"],
            correct: 0,
            info: "Southern exposures maximize natural light, which is essential for design, especially in northern climates."
        },
        {
            q: "How should dividers between learning centres be designed?",
            options: ["High enough to hide children completely", "Non-existent (no dividers at all)", "High enough for children to feel enclosed, but low enough for educators to monitor", "Made of heavy metal for safety"],
            correct: 2,
            info: "Dividers should balance the child's need for a defined space with the educator's need for safety monitoring."
        }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        const q = quizData[currentIdx];
        document.getElementById("progress").innerText = `Question ${currentIdx + 1} of ${quizData.length}`;
        document.getElementById("question-text").innerText = q.q;
        document.getElementById("feedback").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        q.options.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx) {
        if (answered) return;
        answered = true;
        const q = quizData[currentIdx];
        const options = document.getElementsByClassName("option");
        
        if (selectedIdx === q.correct) {
            options[selectedIdx].classList.add("correct");
            score++;
            showFeedback("Correct! " + q.info, "var(--success)");
        } else {
            options[selectedIdx].classList.add("wrong");
            options[q.correct].classList.add("correct");
            showFeedback("Incorrect. " + q.info, "#f39c12");
        }
        document.getElementById("next-btn").style.display = "block";
    }

    function showFeedback(text, color) {
        const fb = document.getElementById("feedback");
        fb.innerText = text;
        fb.style.display = "block";
        fb.style.backgroundColor = color + "22"; // transparent version
        fb.style.color = color;
        fb.style.border = `1px solid ${color}`;
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        document.getElementById("quiz-content").style.display = "none";
        document.getElementById("score-screen").style.display = "block";
        document.getElementById("final-score").innerText = `You scored ${score} out of ${quizData.length}!`;
    }

    loadQuestion();
</script>

</body>
</html>
