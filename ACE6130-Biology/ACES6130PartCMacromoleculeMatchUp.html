<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macromolecule Matching Game</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #27ae60;
            --bg: #f4f7f6;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; }
        p { margin-bottom: 20px; color: #666; }

        .game-container {
            display: flex;
            gap: 50px;
            max-width: 800px;
            width: 100%;
            justify-content: center;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .draggable {
            background: white;
            padding: 15px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            cursor: grab;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, opacity 0.2s;
        }

        .draggable:active { cursor: grabbing; }
        .draggable.dragging { opacity: 0.5; transform: scale(0.95); }

        .dropzone {
            background: #fff;
            padding: 20px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        .dropzone span {
            font-size: 0.9em;
            color: #888;
            pointer-events: none;
        }

        .dropzone.hover {
            background: #e1f5fe;
            border-color: var(--primary);
        }

        .dropzone.correct {
            background: #d4edda;
            border-color: var(--success);
            border-style: solid;
        }

        .function-label {
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            display: block;
        }

        #message {
            margin-top: 30px;
            font-weight: bold;
            font-size: 1.2em;
            height: 1.5em;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover { background-color: #357abd; }
    </style>
</head>
<body>

    <h1>Macromolecule Match-Up</h1>
    <p>Drag the macromolecule to its correct function!</p>

    <div class="game-container">
        <!-- Draggable Items -->
        <div class="column" id="macromolecules">
            <div class="draggable" draggable="true" id="carb" data-match="C">Carbohydrates</div>
            <div class="draggable" draggable="true" id="lipid" data-match="B">Lipids</div>
            <div class="draggable" draggable="true" id="protein" data-match="D">Proteins</div>
            <div class="draggable" draggable="true" id="nucleic" data-match="A">Nucleic Acids</div>
        </div>

        <!-- Target Zones -->
        <div class="column">
            <div class="function-card">
                <div class="function-label">A - Genetic information</div>
                <div class="dropzone" data-id="A"><span>Drop here</span></div>
            </div>
            <div class="function-card">
                <div class="function-label">B - Long-term energy</div>
                <div class="dropzone" data-id="B"><span>Drop here</span></div>
            </div>
            <div class="function-card">
                <div class="function-label">C - Fast energy</div>
                <div class="dropzone" data-id="C"><span>Drop here</span></div>
            </div>
            <div class="function-card">
                <div class="function-label">D - Catalysis & Structure</div>
                <div class="dropzone" data-id="D"><span>Drop here</span></div>
            </div>
        </div>
    </div>

    <div id="message"></div>
    <button onclick="window.location.reload()">Reset Game</button>

    <script>
        const draggables = document.querySelectorAll('.draggable');
        const dropzones = document.querySelectorAll('.dropzone');
        const message = document.getElementById('message');
        let matchesFound = 0;

        // Shuffle the draggable items on load
        const container = document.getElementById('macromolecules');
        for (let i = container.children.length; i >= 0; i--) {
            container.appendChild(container.children[Math.random() * i | 0]);
        }

        draggables.forEach(draggable => {
            draggable.addEventListener('dragstart', () => {
                draggable.classList.add('dragging');
            });

            draggable.addEventListener('dragend', () => {
                draggable.classList.remove('dragging');
            });
        });

        dropzones.forEach(zone => {
            zone.addEventListener('dragover', e => {
                e.preventDefault();
                zone.classList.add('hover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('hover');
            });

            zone.addEventListener('drop', e => {
                e.preventDefault();
                zone.classList.remove('hover');
                const draggedElement = document.querySelector('.dragging');
                const matchID = draggedElement.getAttribute('data-match');
                const zoneID = zone.getAttribute('data-id');

                if (matchID === zoneID) {
                    // Correct Match
                    zone.appendChild(draggedElement);
                    zone.classList.add('correct');
                    draggedElement.setAttribute('draggable', 'false');
                    draggedElement.style.cursor = 'default';
                    matchesFound++;
                    
                    if (matchesFound === 4) {
                        message.innerText = "🎉 Perfect Match! You mastered macromolecules!";
                        message.style.color = "var(--success)";
                    }
                } else {
                    // Wrong Match
                    message.innerText = "❌ Not quite! Try again.";
                    message.style.color = "red";
                    setTimeout(() => { message.innerText = ""; }, 1500);
                }
            });
        });
    </script>
</body>
</html>
