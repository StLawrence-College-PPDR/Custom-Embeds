<div id="quiz-container" style="font-family: Arial, sans-serif; max-width: 500px; border: 1px solid #ccc; padding: 20px; border-radius: 10px; background-color: #f9f9f9; box-shadow: 2px 2px 10px rgba(0,0,0,0.1);">
  <h3 style="color: #2c3e50; margin-top: 0;">Short Answer Question</h3>
  <p style="font-size: 1.1em; line-height: 1.4;">Explain the reason that a high fever (extreme body temperature) can be dangerous for cellular metabolism?</p>
  
  <textarea id="user-answer" placeholder="Type your answer here..." style="width: 100%; height: 80px; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; resize: none; margin-bottom: 10px; font-size: 1em;"></textarea>
  
  <button onclick="checkAnswer()" style="background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1em; font-weight: bold;">Check Answer</button>
  <button onclick="showAnswer()" style="background-color: #ecf0f1; color: #7f8c8d; border: 1px solid #bdc3c7; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1em; margin-left: 10px;">Show Key</button>

  <div id="feedback" style="margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 5px;"></div>
</div>

<script>
function checkAnswer() {
  const answer = document.getElementById('user-answer').value.toLowerCase();
  const feedback = document.getElementById('feedback');
  feedback.style.display = 'block';
  
  // Checking for essential keywords: 'denature' and 'enzyme'
  if (answer.includes('denature') && answer.includes('enzyme')) {
    feedback.innerHTML = "✅ Correct! High temperatures cause enzymes to denature (lose their shape), which halts metabolic processes.";
    feedback.style.backgroundColor = "#d4edda";
    feedback.style.color = "#155724";
  } else if (answer.trim() === "") {
    feedback.innerHTML = "⚠️ Please type an answer before checking.";
    feedback.style.backgroundColor = "#fff3cd";
    feedback.style.color = "#856404";
  } else {
    feedback.innerHTML = "❌ Not quite. Think about what happens to <b>enzymes</b> at high temperatures. (Hint: They 'denature').";
    feedback.style.backgroundColor = "#f8d7da";
    feedback.style.color = "#721c24";
  }
}

function showAnswer() {
  const feedback = document.getElementById('feedback');
  feedback.style.display = 'block';
  feedback.innerHTML = "<b>Suggested Answer:</b> High fevers can denature enzymes, slowing or stopping essential metabolic reactions.";
  feedback.style.backgroundColor = "#e2e3e5";
  feedback.style.color = "#383d41";
}
</script>
