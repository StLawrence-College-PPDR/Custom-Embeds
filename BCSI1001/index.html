<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Realtime Multi‑User Poll</title>
  <style>
 body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; max-width: 800px; margin: auto; }
 h1 { font-size: 1.6rem; margin-bottom: 6px; }
 .meta { color: #666; margin-bottom: 16px; }

 .poll-input { display: flex; gap: 8px; margin-bottom: 20px; }
 input[type=text] { flex: 1; padding: 10px; font-size: 1rem; }
 button { padding: 10px 14px; font-size: 1rem; cursor: pointer; }

 .chart { display: flex; flex-direction: column; gap: 12px; }
 .bar-row { display: flex; align-items: center; gap: 12px; }
 .label { width: 180px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-container { flex: 1; background: #eee; border-radius: 6px; overflow: hidden; }
 .bar {
 height: 26px;
 background: linear-gradient(90deg, #4f87ff, #7aa2ff);
 width: 0%;
 display: flex;
 align-items: center;
 justify-content: flex-end;
 color: #fff;
 padding-right: 8px;
 box-sizing: border-box;
 transition: width 0.25s ease;
 }

 .footer { margin-top: 24px; font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
 <h1>Live Poll (Realtime)</h1>
 <div id="meta" class="meta">Connecting…</div>
  <div class="poll-input">
    <input id="answerInput" type="text" placeholder="Type your answer…" />
    <button id="submitBtn">Submit</button>
  </div>

  <div id="chart" class="chart"></div>


 <div class="footer">
 Real‑time voting across devices. One vote per browser session.
 </div>


 <!-- Firebase SDKs (CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>



 <script>
 /* ===================================================
 🔥 FIREBASE SETUP (REQUIRED)
 1. Create a Firebase project
 2. Enable Realtime Database
 3. Replace config below
 =================================================== */


 const firebaseConfig = {
apiKey: "AIzaSyCRp38VMYdb07rudTKwcCCLZy2u9b9HVMk",
    authDomain: "bcsi1001-hackathon-database.firebaseapp.com",
    databaseURL: "https://bcsi1001-hackathon-database-default-rtdb.firebaseio.com",
    projectId: "bcsi1001-hackathon-database",
    storageBucket: "bcsi1001-hackathon-database.firebasestorage.app",
    messagingSenderId: "458743236902",
    appId: "1:458743236902:web:a7c03dbb0b2e161228d9e7",
    measurementId: "G-C17HTW8KRD"
 };


 firebase.initializeApp(firebaseConfig);
 const db = firebase.database();
 const pollRef = db.ref('poll');


 /* =========================
 CONFIG
 ========================= */

 const SYNONYMS = {
 'nyc': 'new york',
 'new york city': 'new york',
 'usa': 'united states',
 'us': 'united states'
 };

 const MAX_EDIT_DISTANCE = 1;
 /* =========================
 STATE
 ========================= */

 let hasVoted = sessionStorage.getItem('hasVoted') === 'true';

    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const chart = document.getElementById('chart');
 const meta = document.getElementById('meta');

 /* =========================
 UTILITIES
 ========================= */

    function normalize(text) {
 const base = text.trim().toLowerCase();
 return SYNONYMS[base] || base;
    }


 function levenshtein(a, b) {
 const dp = Array.from({ length: a.length + 1 }, () => []);
 for (let i = 0; i <= a.length; i++) dp[i][0] = i;
 for (let j = 0; j <= b.length; j++) dp[0][j] = j;
 for (let i = 1; i <= a.length; i++) {
 for (let j = 1; j <= b.length; j++) {
 dp[i][j] = Math.min(
 dp[i - 1][j] + 1,
 dp[i][j - 1] + 1,
 dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
 );
 }
 }
 return dp[a.length][b.length];
 }

 function findExistingKey(candidate, data) {
 for (const key of Object.keys(data)) {
 if (levenshtein(key, candidate) <= MAX_EDIT_DISTANCE) return key;
 }
 return null;
 }


 /* =========================
 SUBMISSION
 ========================= */


 submitBtn.addEventListener('click', async () => {
 if (hasVoted) return;

      const raw = input.value;
      if (!raw.trim()) return;


 const normalized = normalize(raw);

 await pollRef.transaction(data => {
 data = data || {};
 const key = findExistingKey(normalized, data) || normalized;
 if (!data[key]) data[key] = { label: raw.trim(), count: 0 };
 data[key].count += 1;
 return data;
 });
 hasVoted = true;
 sessionStorage.setItem('hasVoted', 'true');
      input.value = '';
 });
 input.addEventListener('keydown', e => {
 if (e.key === 'Enter') submitBtn.click();
 });
 /* =========================
 REAL‑TIME LISTENER
 ========================= */

 pollRef.on('value', snapshot => {
 const data = snapshot.val() || {};
 renderChart(data);
 });
 function renderChart(data) {
      chart.innerHTML = '';
 const values = Object.values(data);
 const totalVotes = values.reduce((s, v) => s + v.count, 0);
 meta.textContent = `Total votes: ${totalVotes}${hasVoted ? ' (you voted)' : ''}`;
      if (values.length === 0) return;
      const max = Math.max(...values.map(v => v.count));

      values
        .sort((a, b) => b.count - a.count)
        .forEach(({ label, count }) => {
 const percent = Math.round((count / totalVotes) * 100);


          const row = document.createElement('div');
          row.className = 'bar-row';


          const labelEl = document.createElement('div');
          labelEl.className = 'label';
          labelEl.textContent = label;


          const barContainer = document.createElement('div');
          barContainer.className = 'bar-container';


          const bar = document.createElement('div');
          bar.className = 'bar';
          bar.style.width = `${(count / max) * 100}%`;
 bar.textContent = `${count} (${percent}%)`;


 barContainer.appendChild(bar);
          row.appendChild(labelEl);
          row.appendChild(barContainer);
          chart.appendChild(row);
        });
    }
  </script>
</body>
