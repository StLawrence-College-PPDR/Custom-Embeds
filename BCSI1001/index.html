<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <!-- Firebase SDKs (CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

 <title>Realtime Multi‑User Poll</title>
  <style>
 body { font-family: "Montserrat", sans-serif; padding: 24px; max-width: 1400px; margin: auto; background: #f3f3f3;}
 h1 { font-size: 1.6rem; margin-bottom: 6px; font-weight: 300; font-size: 3.5rem;}
 .meta { color: #666; margin-bottom: 16px; }

 .poll-input { display: flex; gap: 8px; margin-bottom: 20px; }
 input[type=text] { flex: 1; padding: 15px; font-size: 1rem; border: 0; border-radius: 3px;}
 button { padding: 10px 14px; font-size: 1rem; cursor: pointer;  border: 0; background: #dfdfdf;}

 .chart { display: flex; flex-direction: column; gap: 12px; }
 .bar-row { display: flex; align-items: center; gap: 30px; }
 .label { width: 180px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-container { flex: 1; background: #dfdfdf; border-radius: 3px; overflow: hidden; }
 .bar {
 height: 40px;
 background: linear-gradient(90deg, #f35e53, #d3473c);
 width: 0%;
 display: flex;
 align-items: center;
 justify-content: flex-end;
 color: #fff;
 padding-right: 8px;
 box-sizing: border-box;
 transition: width 0.25s ease;
 }



 button#resetBtn {
    margin-top: 30px;

 }

 .flex-collection {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    justify-content: space-between;
    margin-top: 50px;

 }

 .callout-collection {
    background: #FFFFFF;
    border-radius: 5px;
    font-weight: 600;
 }

 .callout {
    text-align: center;
    padding-bottom: 30px;
 }

 .callout-label {
    color: #d3473c;
    font-weight: 800;
    font-size: 2rem;
}

 @media (min-width: 1300px) {
    .flex-3 {
        width: 32%;
    }
    
    .flex-2 {
        width: 48%;
    }
    
    .flex-4 {
        width: 23%;
    }
    
    .flex-5 {
        width: 18%;
    }
    
    .flex-6 {
        width: 15%;
    }
    
    .flex-7 {
        width: 13%;
    }
}

@media (min-width: 992px) and (max-width: 1300px) {
    .flex-3 {
        width: 48%;
    }
    
    .flex-2 {
        width: 48%;
    }
    
    .flex-4 {
        width: 23%;
    }
    
    .flex-5 {
        width: 48%;
    }
    
    .flex-6 {
        width: 100%;
    }
    
    .flex-7 {
        width: 100%;
    }
}

@media (max-width: 992px) {
    .flex-3 {
        width: 100%;
    }
    
    .flex-2 {
        width: 100%;
    }
    
    .flex-4 {
        width: 100%;
    }
    
    .flex-5 {
        width: 100%;
    }
    
    .flex-6 {
        width: 100%;
    }
    
    .flex-7 {
        width: 100%;
    }
}


 .footer { margin-top: 24px; font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
    <div class="flex-collection">
        <div class="flex-2">
            <h1>Team Voting</h1>
             <div id="meta" class="meta">Connecting…</div>
              <div class="poll-input">
                <input id="answerInput" type="text" placeholder="Enter your team vote…" />
                <button id="submitBtn">Vote</button>
              </div>

              <div id="chart" class="chart"></div>

               <div class="footer">
                        Real‑time anonymous voting across devices. One vote per browser session. Your team votes must have a unique name. Typos are forgiven, make sure team names are different.
                 </div>


                <button id="resetBtn">Reset Poll (Passcode Required)</button>
        </div>

        <div class="flex-2">
            <div class="callout-collection">
                <img src="animation.svg" width="100%"/>
                <div id="callout" class="callout" hidden></div>
            </div>
        </div>
    </div>





 <script>
 /* ===================================================
 🔥 FIREBASE SETUP (REQUIRED)
 1. Create a Firebase project
 2. Enable Realtime Database
 3. Replace config below
 =================================================== */

const ADMIN_PASSCODE = 'BCSIRESET2026';


 const firebaseConfig = {
apiKey: "AIzaSyCRp38VMYdb07rudTKwcCCLZy2u9b9HVMk",
    authDomain: "bcsi1001-hackathon-database.firebaseapp.com",
    databaseURL: "https://bcsi1001-hackathon-database-default-rtdb.firebaseio.com",
    projectId: "bcsi1001-hackathon-database",
    storageBucket: "bcsi1001-hackathon-database.firebasestorage.app",
    messagingSenderId: "458743236902",
    appId: "1:458743236902:web:a7c03dbb0b2e161228d9e7",
    measurementId: "G-C17HTW8KRD"
 };


 firebase.initializeApp(firebaseConfig);
 const db = firebase.database();
 const pollRef = db.ref('poll');


 /* =========================
 CONFIG
 ========================= */

 const SYNONYMS = {
 'nyc': 'new york',
 'new york city': 'new york',
 'usa': 'united states',
 'us': 'united states'
 };

 const MAX_EDIT_DISTANCE = 1;
 /* =========================
 STATE
 ========================= */

 let hasVoted = sessionStorage.getItem('hasVoted') === 'true';

    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const chart = document.getElementById('chart');
 const meta = document.getElementById('meta');

 /* =========================
 UTILITIES
 ========================= */

    function normalize(text) {
 const base = text.trim().toLowerCase();
 return SYNONYMS[base] || base;
    }


 function levenshtein(a, b) {
 const dp = Array.from({ length: a.length + 1 }, () => []);
 for (let i = 0; i <= a.length; i++) dp[i][0] = i;
 for (let j = 0; j <= b.length; j++) dp[0][j] = j;
 for (let i = 1; i <= a.length; i++) {
 for (let j = 1; j <= b.length; j++) {
 dp[i][j] = Math.min(
 dp[i - 1][j] + 1,
 dp[i][j - 1] + 1,
 dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
 );
 }
 }
 return dp[a.length][b.length];
 }

 function findExistingKey(candidate, data) {
 for (const key of Object.keys(data)) {
 if (levenshtein(key, candidate) <= MAX_EDIT_DISTANCE) return key;
 }
 return null;
 }


 /* =========================
 SUBMISSION
 ========================= */


 submitBtn.addEventListener('click', async () => {
 if (hasVoted) return;

      const raw = input.value;
      if (!raw.trim()) return;


 const normalized = normalize(raw);

 await pollRef.transaction(data => {
 data = data || {};
 const key = findExistingKey(normalized, data) || normalized;
 if (!data[key]) data[key] = { label: raw.trim(), count: 0 };
 data[key].count += 1;
 return data;
 });
 hasVoted = true;
 sessionStorage.setItem('hasVoted', 'true');
      input.value = '';
 });
 input.addEventListener('keydown', e => {
 if (e.key === 'Enter') submitBtn.click();
 });
 /* =========================
 REAL‑TIME LISTENER
 ========================= */

 pollRef.on('value', snapshot => {
 const data = snapshot.val() || {};
 renderChart(data);
 });
 function renderChart(data) {
      chart.innerHTML = '';
 const values = Object.values(data);
 const totalVotes = values.reduce((s, v) => s + v.count, 0);
 meta.textContent = `Total votes: ${totalVotes}${hasVoted ? ' (you voted)' : ''}`;
      if (values.length === 0) return;
      const max = Math.max(...values.map(v => v.count));

      values
        .sort((a, b) => b.count - a.count)
        .forEach(({ label, count }) => {
 const percent = Math.round((count / totalVotes) * 100);


const top = values.reduce((a, b) => (b.count > a.count ? b : a));
const topPercent = Math.round((top.count / totalVotes) * 100);

callout.hidden = false;
callout.innerHTML = `
  <div class="callout-label">${top.label}</div>
  <div class="callout-meta">${topPercent}% of Votes</div>
`;


          const row = document.createElement('div');
          row.className = 'bar-row';


          const labelEl = document.createElement('div');
          labelEl.className = 'label';
          labelEl.textContent = label;


          const barContainer = document.createElement('div');
          barContainer.className = 'bar-container';


          const bar = document.createElement('div');
          bar.className = 'bar';
          bar.style.width = `${(count / max) * 100}%`;
 bar.textContent = `${count} (${percent}%)`;


 barContainer.appendChild(bar);
          row.appendChild(labelEl);
          row.appendChild(barContainer);
          chart.appendChild(row);
        });
    }


resetBtn.addEventListener('click', async () => {
  const entered = prompt('Enter admin passcode to reset poll:');
  if (entered === ADMIN_PASSCODE) {
    await pollRef.remove();
    sessionStorage.clear();
    alert('Poll has been reset.');
  }
});



  </script>
</body>
