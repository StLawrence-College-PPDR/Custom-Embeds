<script>
  var iframe = document.querySelector('iframe');
  var player = new Vimeo.Player(iframe);
    
    player.on('loaded', function() {
        $("#pausebutton").show();
        $("#mutebutton").show();
    });
    
    $("#unmutebutton").hide();
    $("#playbutton").hide();
    
    player.on('play', function() {
      console.log('Video Playing');
      player.setVolume(1);
    });
    
    player.on('ended', function() {
      console.log('video over');
      $('.pass2').fadeIn('slow');
    });
    
    $("#playbutton").click(function() {
     $("#pausebutton").show();
     $("#playbutton").hide();
     player.play();
   });
    
   $("#pausebutton").click(function() {
      $("#playbutton").show();
      $("#pausebutton").hide();
      player.pause();
   });
   
   $("#mutebutton").click(function() {
      $("#unmutebutton").show();
      $("#mutebutton").hide();
      player.setVolume(0);
   });
   
   $("#unmutebutton").click(function() {
      $("#mutebutton").show();
      $("#unmutebutton").hide();
      player.setVolume(1);
   });
</script>

<div id="loading"></div>

<div class="controls">
<div class="playcontrols">
  <button id="playbutton"><i class="fa-solid fa-play"></i></button>
  <button id="pausebutton"><i class="fa-solid fa-pause"></i></button>
</div>
<div class="volumecontrols">
  <button id="mutebutton"><i class="fa-solid fa-volume-xmark"></i></button>
  <button id="unmutebutton"><i class="fa-solid fa-volume-high"></i></button>
</div>
</div>
