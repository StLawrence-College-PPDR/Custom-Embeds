<div id="quiz-container" style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; background-color: #f9f9f9;">
    <h2 style="text-align: center; color: #2c3e50;">Knowledge Check: Physical Development</h2>
    <hr>
    <div id="question-box">
        <p id="question-text" style="font-size: 1.1em; font-weight: bold;"></p>
        <div id="options-container"></div>
    </div>
    <div id="result-area" style="margin-top: 20px; font-weight: bold; text-align: center;"></div>
    <button id="next-btn" onclick="nextQuestion()" style="display: block; margin: 20px auto; padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">Next Question</button>
</div>

<script>
    const quizData = [
        { q: "What is the prerequisite for successful toilet training?", a: ["Age of two", "Control over urination/bowels", "Verbal skills", "High self-efficacy"], correct: 1 },
        { q: "Which is an example of 'growth determining experience'?", a: ["A tall child playing sports", "Feeling confident", "An infant rolling over to see surroundings", "Receiving a vaccine"], correct: 2 },
        { q: "How might others respond to a 12-month-old who looks like a 2-year-old?", a: ["Expect higher language/social skills", "Ignore the child", "Expect better fine motor skills", "No effect"], correct: 0 },
        { q: "Self-efficacy is most closely related to growth affecting:", a: ["New behaviors", "Experience", "Others' responses", "Self-concept"], correct: 3 },
        { q: "Diseases are categorized primarily as:", a: ["Biological factors", "Environmental factors", "Genetic factors", "Maturation factors"], correct: 1 },
        { q: "A 7lb baby should weigh how much at one year?", a: ["14 lbs", "18 lbs", "21 lbs", "28 lbs"], correct: 2 },
        { q: "Adult head size is what fraction of the total body?", a: ["1/5", "1/10", "1/6", "1/8"], correct: 3 },
        { q: "The brain's susceptibility to experiences is known as:", a: ["Sensory Integration", "Plasticity", "Genotype", "Dynamic Systems"], correct: 1 },
        { q: "Which of the following is a 'Fine Motor Skill'?", a: ["Crawling", "Running", "Pincer grasp", "Hopping"], correct: 2 },
        { q: "The most effective accident prevention technique is:", a: ["Pool fencing", "Helmets", "Adult supervision", "Car seats"], correct: 2 }
    ];

    let currentQ = 0;
    let score = 0;

    function loadQuestion() {
        const qBox = document.getElementById("question-text");
        const optBox = document.getElementById("options-container");
        const resArea = document.getElementById("result-area");
        
        resArea.innerHTML = "";
        optBox.innerHTML = "";
        qBox.innerText = `Question ${currentQ + 1}: ${quizData[currentQ].q}`;

        quizData[currentQ].a.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.style = "display: block; width: 100%; margin: 5px 0; padding: 10px; text-align: left; cursor: pointer; border: 1px solid #ddd; border-radius: 5px;";
            btn.onclick = () => checkAnswer(index);
            optBox.appendChild(btn);
        });
    }

    function checkAnswer(choice) {
        const resArea = document.getElementById("result-area");
        if (choice === quizData[currentQ].correct) {
            resArea.innerHTML = "<span style='color: green;'>Correct!</span>";
            score++;
        } else {
            resArea.innerHTML = `<span style='color: red;'>Incorrect. The correct answer was: ${quizData[currentQ].a[quizData[currentQ].correct]}</span>`;
        }
        const buttons = document.querySelectorAll("#options-container button");
        buttons.forEach(b => b.disabled = true);
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < quizData.length) {
            loadQuestion();
        } else {
            document.getElementById("quiz-container").innerHTML = `<h2>Quiz Complete!</h2><p>Your score: ${score} out of ${quizData.length}</p><button onclick='location.reload()' style='padding: 10px 20px; background-color: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer;'>Restart</button>`;
        }
    }

    loadQuestion();
</script>
