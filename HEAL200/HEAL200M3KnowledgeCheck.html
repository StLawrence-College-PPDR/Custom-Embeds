<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Active Living Knowledge Check</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 700px; margin: 20px auto; padding: 20px; background-color: #f0f4f8; }
        .quiz-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .progress { font-size: 0.9em; color: #7f8c8d; margin-bottom: 20px; }
        .question { font-size: 1.15em; font-weight: 600; margin-bottom: 20px; display: block; }
        .option { display: block; padding: 12px 15px; margin: 8px 0; border: 2px solid #edf2f7; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .option:hover { background-color: #f8fafc; border-color: #cbd5e0; }
        .option.selected { border-color: #3498db; background-color: #ebf8ff; }
        
        /* Feedback Styles */
        .option.correct { background-color: #c6f6d5; border-color: #38a169; color: #22543d; font-weight: bold; }
        .option.incorrect { background-color: #fed7d7; border-color: #e53e3e; color: #742a2a; }
        .option.disabled { cursor: not-allowed; pointer-events: none; }

        .feedback-text { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-weight: 500; }
        .feedback-text.show { display: block; }

        .controls { margin-top: 25px; display: flex; gap: 10px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: opacity 0.2s; }
        .btn-submit { background-color: #3498db; color: white; }
        .btn-next { background-color: #2ecc71; color: white; display: none; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #results { text-align: center; display: none; }
        .score-circle { width: 100px; height: 100px; line-height: 100px; border-radius: 50%; background: #3498db; color: white; font-size: 2em; margin: 20px auto; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-ui">
        <div class="progress" id="progress">Question 1 of 10</div>
        <div id="question-container">
            <span class="question" id="q-text">Question loading...</span>
            <div id="options-container"></div>
        </div>
        <div id="feedback" class="feedback-text"></div>
        <div class="controls">
            <button id="submit-btn" class="btn-submit" onclick="checkAnswer()">Submit Answer</button>
            <button id="next-btn" class="btn-next" onclick="nextQuestion()">Next Question →</button>
        </div>
    </div>

    <div id="results">
        <h2>Unit Complete!</h2>
        <p>Your total score:</p>
        <div class="score-circle" id="final-score">0</div>
        <button class="btn-submit" onclick="location.reload()">Restart Quiz</button>
    </div>
</div>

<script>
    const quizData = [
        { q: "Between 1971 and 2000, daily calorie consumption for women rose by what percentage?", a: ["7%", "12%", "22%", "15%"], c: 2 },
        { q: "What is considered the 'best way' to encourage children to become involved in active living activities?", a: ["Setting strict rules", "The educator taking part with the children", "Watching educational videos", "Creating complex obstacle courses"], c: 1 },
        { q: "Statistics show that how many children in Canada under 14 are hospitalized each year due to injuries?", a: ["10,000", "40,000", "500", "260"], c: 1 },
        { q: "Injuries can happen anywhere, but in childcare centres, they occur most often in:", a: ["The washrooms", "The nap room", "The kitchen", "The playground"], c: 3 },
        { q: "Which age group is noted for fast developmental milestones, meaning objects out of reach one day may not be the next?", a: ["One year olds", "Two year olds", "Three year olds", "Four year olds"], c: 0 },
        { q: "For a three-year-old's safety, educators should specifically focus on:", a: ["Locking all exits", "Removing small toys", "Securing rugs and removing clutter", "Checking for splintered wood"], c: 2 },
        { q: "All toys must be safe, which means they must be clean, in good repair, and:", a: ["Brand new", "Developmentally appropriate", "Made of plastic", "Stored in boxes"], c: 1 },
        { q: "According to the Day Nurseries Act of Ontario, a fire drill must be conducted at least:", a: ["Once a week", "Every two months", "Once a year", "Once per month"], c: 3 },
        { q: "In Canada, what is the leading cause of death for children and youth aged 1–24?", a: ["Poisoning", "Injuries", "Drowning", "Choking"], c: 1 },
        { q: "Which toy is listed as potentially 'deadly' to a 1-year-old in a mixed age group?", a: ["Stuffed animals", "Riding toys", "Lego blocks", "Nesting toys"], c: 2 }
    ];

    let currentQ = 0;
    let score = 0;
    let selectedIdx = null;

    function loadQuestion() {
        selectedIdx = null;
        const q = quizData[currentQ];
        document.getElementById('progress').innerText = `Question ${currentQ + 1} of ${quizData.length}`;
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('submit-btn').style.display = 'block';
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback').className = 'feedback-text';
        
        const optionsHTML = q.a.map((opt, i) => 
            `<div class="option" onclick="selectOption(${i})" id="opt-${i}">${opt}</div>`
        ).join('');
        document.getElementById('options-container').innerHTML = optionsHTML;
    }

    window.selectOption = function(idx) {
        selectedIdx = idx;
        document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
        document.getElementById(`opt-${idx}`).classList.add('selected');
        document.getElementById('submit-btn').disabled = false;
    }

    window.checkAnswer = function() {
        const q = quizData[currentQ];
        const options = document.querySelectorAll('.option');
        const feedback = document.getElementById('feedback');
        
        options.forEach((el, i) => {
            el.classList.add('disabled');
            if (i === q.c) el.classList.add('correct'); // Highlight correct
            if (selectedIdx === i && i !== q.c) el.classList.add('incorrect'); // Highlight if wrong
        });

        if (selectedIdx === q.c) {
            score++;
            feedback.innerText = "Correct!";
            feedback.classList.add('show', 'correct');
        } else {
            feedback.innerText = `Incorrect. The correct answer was: ${q.a[q.c]}`;
            feedback.classList.add('show', 'incorrect');
        }

        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';
    }

    window.nextQuestion = function() {
        currentQ++;
        if (currentQ < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        document.getElementById('final-score').innerText = `${score}/${quizData.length}`;
    }

    loadQuestion();
</script>

</body>
</html>
