<div id="quiz-container">
    <h3>Matching: WHO Pulmonary Hypertension Classification</h3>
    <p><em>Click a <strong>Class</strong> on the left, then click its matching <strong>Symptom</strong> on the right.</em></p>
    
    <div class="matching-wrapper">
        <div class="column" id="classes-column">
            <div class="match-item" data-id="1">Class I</div>
            <div class="match-item" data-id="2">Class II</div>
            <div class="match-item" data-id="3">Class III</div>
            <div class="match-item" data-id="4">Class IV</div>
        </div>

        <div class="column" id="symptoms-column">
            <!-- Items will be shuffled by JavaScript -->
        </div>
    </div>

    <div id="feedback"></div>
    <button id="reset-btn" onclick="resetQuiz()">Reset Quiz</button>
</div>

<style>
    #quiz-container {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
    }
    .matching-wrapper {
        display: flex;
        gap: 20px;
        margin-top: 20px;
    }
    .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .match-item {
        padding: 15px;
        border: 2px solid #ccc;
        border-radius: 6px;
        background-color: white;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 14px;
        line-height: 1.4;
    }
    .match-item:hover {
        background-color: #eef;
        border-color: #007bff;
    }
    .match-item.selected {
        background-color: #d1ecf1;
        border-color: #0c5460;
    }
    .match-item.matched {
        background-color: #d4edda;
        border-color: #28a745;
        cursor: default;
        opacity: 0.7;
    }
    #feedback {
        margin-top: 20px;
        padding: 10px;
        font-weight: bold;
        text-align: center;
        min-height: 20px;
    }
    #reset-btn {
        display: block;
        margin: 20px auto 0;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    #reset-btn:hover { background-color: #0056b3; }
</style>

<script>
    const data = [
        { id: "1", text: "Without resulting limitation of physical activity. Ordinary physical activity does not cause undue dyspnea." },
        { id: "2", text: "Slight limitation of physical activity. Comfortable at rest. Ordinary physical activity causes undue dyspnea or fatigue, chest pain or near syncope." },
        { id: "3", text: "Marked limitation of physical activity. Comfortable at rest. Less than ordinary activity causes undue dyspnea or fatigue, chest pain or near syncope." },
        { id: "4", text: "Inability to carry out any physical activity without symptoms. Manifest signs of right heart failure. Dyspnea and/or fatigue may be present at rest. Discomfort is increased by ANY physical activity." }
    ];

    let selectedClass = null;
    let selectedSymptom = null;
    let matchesFound = 0;

    function initQuiz() {
        const symptomsCol = document.getElementById('symptoms-column');
        symptomsCol.innerHTML = '';
        
        // Shuffle symptoms
        const shuffled = [...data].sort(() => Math.random() - 0.5);
        
        shuffled.forEach(item => {
            const div = document.createElement('div');
            div.className = 'match-item';
            div.dataset.id = item.id;
            div.innerText = item.text;
            div.onclick = () => handleSelect(div, 'symptom');
            symptomsCol.appendChild(div);
        });

        document.querySelectorAll('#classes-column .match-item').forEach(item => {
            item.className = 'match-item';
            item.onclick = () => handleSelect(item, 'class');
        });
        
        document.getElementById('feedback').innerText = '';
        matchesFound = 0;
    }

    function handleSelect(element, type) {
        if (element.classList.contains('matched')) return;

        if (type === 'class') {
            document.querySelectorAll('#classes-column .match-item').forEach(i => i.classList.remove('selected'));
            selectedClass = element;
        } else {
            document.querySelectorAll('#symptoms-column .match-item').forEach(i => i.classList.remove('selected'));
            selectedSymptom = element;
        }
        element.classList.add('selected');

        if (selectedClass && selectedSymptom) {
            checkMatch();
        }
    }

    function checkMatch() {
        const feedback = document.getElementById('feedback');
        
        if (selectedClass.dataset.id === selectedSymptom.dataset.id) {
            selectedClass.classList.add('matched');
            selectedSymptom.classList.add('matched');
            selectedClass.classList.remove('selected');
            selectedSymptom.classList.remove('selected');
            feedback.innerText = "Correct Match!";
            feedback.style.color = "green";
            matchesFound++;
        } else {
            selectedClass.classList.remove('selected');
            selectedSymptom.classList.remove('selected');
            feedback.innerText = "Incorrect. Try again.";
            feedback.style.color = "red";
        }
        
        selectedClass = null;
        selectedSymptom = null;

        if (matchesFound === data.length) {
            feedback.innerText = "Excellent! You've matched all classes correctly.";
        }
    }

    function resetQuiz() {
        initQuiz();
    }

    initQuiz();
</script>
