<div id="matching-activity-container" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; border: 2px solid #2c3e50; border-radius: 12px; background-color: #f9f9f9; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #2c3e50; margin-bottom: 10px;">Valvular Disorders Matching</h2>
    <p style="text-align: center; color: #7f8c8d; font-size: 0.9em;">Click a <b>Disorder</b> on the left, then click its <b>Descriptor</b> on the right.</p>

    <div style="display: flex; justify-content: space-between; gap: 20px; margin-top: 20px;">
        <!-- Left Column: Disorders -->
        <div id="disorder-list" style="flex: 1; display: flex; flex-direction: column; gap: 10px;"></div>
        
        <!-- Right Column: Descriptors -->
        <div id="descriptor-list" style="flex: 1; display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <div id="feedback-area" style="margin-top: 25px; text-align: center; min-height: 30px; font-weight: bold; font-size: 1.1em;"></div>

    <div style="text-align: center; margin-top: 20px;">
        <button onclick="resetMatchingGame()" style="padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; transition: background 0.3s;">Reset Activity</button>
    </div>
</div>

<script>
const matchingPairs = [
    { term: "Mitral valve prolapse", desc: "Allows leaflets to move backward into left atrium during systole" },
    { term: "Pulmonic valve stenosis", desc: "Results in backward flow from the RV" },
    { term: "Aortic valve regurgitation", desc: "Results in volume overload from retrograde blood flow from ascending aorta to LV" },
    { term: "Tricuspid valve stenosis", desc: "Occurs almost exclusively in clients who are IV drug users" },
    { term: "Aortic valve stenosis", desc: "Obstruction of flow from LV to aorta during systole" }
];

let selectedTerm = null;
let matchesFound = 0;

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function initGame() {
    const disorderList = document.getElementById('disorder-list');
    const descriptorList = document.getElementById('descriptor-list');
    const feedback = document.getElementById('feedback-area');
    
    disorderList.innerHTML = '';
    descriptorList.innerHTML = '';
    feedback.innerHTML = '';
    feedback.style.color = 'black';
    selectedTerm = null;
    matchesFound = 0;

    const shuffledTerms = shuffle([...matchingPairs]);
    const shuffledDescs = shuffle([...matchingPairs]);

    shuffledTerms.forEach(pair => {
        const div = document.createElement('div');
        div.textContent = pair.term;
        div.className = 'match-card term';
        div.style = "padding: 15px; background: white; border: 1px solid #bdc3c7; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s;";
        div.onclick = () => selectTerm(div, pair.term);
        disorderList.appendChild(div);
    });

    shuffledDescs.forEach(pair => {
        const div = document.createElement('div');
        div.textContent = pair.desc;
        div.className = 'match-card desc';
        div.style = "padding: 15px; background: white; border: 1px solid #bdc3c7; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; min-height: 60px; display: flex; align-items: center; justify-content: center; font-size: 0.85em;";
        div.onclick = () => selectDesc(div, pair.desc);
        descriptorList.appendChild(div);
    });
}

function selectTerm(element, term) {
    if (element.classList.contains('matched')) return;
    document.querySelectorAll('.term').forEach(el => el.style.borderColor = '#bdc3c7');
    document.querySelectorAll('.term').forEach(el => el.style.backgroundColor = 'white');
    element.style.borderColor = '#3498db';
    element.style.backgroundColor = '#ebf5fb';
    selectedTerm = { element, term };
}

function selectDesc(element, desc) {
    if (!selectedTerm || element.classList.contains('matched')) return;
    
    const correctPair = matchingPairs.find(p => p.term === selectedTerm.term);
    const feedback = document.getElementById('feedback-area');

    if (correctPair.desc === desc) {
        // Correct Match
        selectedTerm.element.classList.add('matched');
        element.classList.add('matched');
        selectedTerm.element.style.backgroundColor = '#2ecc71';
        selectedTerm.element.style.color = 'white';
        element.style.backgroundColor = '#2ecc71';
        element.style.color = 'white';
        feedback.textContent = "Correct Match!";
        feedback.style.color = '#27ae60';
        matchesFound++;
        selectedTerm = null;

        if (matchesFound === matchingPairs.length) {
            feedback.textContent = "Great job! All disorders matched correctly.";
        }
    } else {
        // Incorrect Match
        feedback.textContent = "Try again!";
        feedback.style.color = '#e74c3c';
        element.style.backgroundColor = '#fadbd8';
        setTimeout(() => {
            if (!element.classList.contains('matched')) {
                element.style.backgroundColor = 'white';
            }
        }, 500);
    }
}

function resetMatchingGame() {
    initGame();
}

initGame();
</script>
