<div id="ekg-quiz-container" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 650px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; background-color: #f9f9f9; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #2c3e50;">EKG Axis Deviation Challenge</h2>
    <p style="font-size: 0.95em; color: #555; margin-bottom: 20px;">
        Using the dropdown, indicate whether the illness listed would cause a <strong>Right</strong> or <strong>Left</strong> axis deviation.
    </p>

    <table style="width: 100%; border-collapse: collapse; background: white;">
        <thead>
            <tr style="background-color: #34495e; color: white;">
                <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">Condition</th>
                <th style="padding: 12px; text-align: center; border: 1px solid #ddd; width: 140px;">Axis Deviation</th>
            </tr>
        </thead>
        <tbody id="quiz-body">
            <!-- Questions will be injected here by JavaScript -->
        </tbody>
    </table>

    <div style="margin-top: 20px; text-align: center;">
        <button id="check-btn" onclick="checkAnswers()" style="padding: 10px 25px; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; font-weight: bold; transition: background 0.3s;">Check Answers</button>
        <button id="reset-btn" onclick="resetQuiz()" style="padding: 10px 25px; background-color: #95a5a6; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; font-weight: bold; margin-left: 10px;">Reset</button>
    </div>

    <div id="result-display" style="margin-top: 20px; text-align: center; font-weight: bold; font-size: 1.1em; display: none;"></div>
</div>

<script>
    const questions = [
        { name: "Right ventricular hypertrophy", answer: "Right" },
        { name: "Ventricular tachycardia", answer: "Left" },
        { name: "Anterolateral MI", answer: "Right" },
        { name: "Inferior MI", answer: "Left" },
        { name: "Left Posterior hemiblock", answer: "Right" },
        { name: "Left ventricular hypertrophy", answer: "Left" },
        { name: "Chronic lung disease", answer: "Right" },
        { name: "Hyperkalemia", answer: "Left" },
        { name: "Wolff Parkinson White", answer: "Both" },
        { name: "Left anterior hemiblock", answer: "Left" },
        { name: "Pulmonary embolism", answer: "Right" },
        { name: "Pregnancy", answer: "Left" }
    ];

    function initQuiz() {
        const tbody = document.getElementById('quiz-body');
        tbody.innerHTML = '';
        questions.forEach((q, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="padding: 10px; border: 1px solid #ddd;">${q.name}</td>
                <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">
                    <select id="q-${index}" style="padding: 5px; width: 100%; border-radius: 4px; border: 1px solid #ccc;">
                        <option value="">-- Select --</option>
                        <option value="Right">Right</option>
                        <option value="Left">Left</option>
                        <option value="Both">Both</option>
                    </select>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function checkAnswers() {
        let score = 0;
        questions.forEach((q, index) => {
            const select = document.getElementById(`q-${index}`);
            const cell = select.parentElement;
            if (select.value === q.answer) {
                score++;
                cell.style.backgroundColor = "#d4edda"; // Light green
                select.style.borderColor = "#28a745";
            } else {
                cell.style.backgroundColor = "#f8d7da"; // Light red
                select.style.borderColor = "#dc3545";
            }
        });

        const resultDisplay = document.getElementById('result-display');
        resultDisplay.style.display = "block";
        resultDisplay.innerHTML = `Your Score: ${score} / ${questions.length}`;
        resultDisplay.style.color = score === questions.length ? "#27ae60" : "#c0392b";
    }

    function resetQuiz() {
        initQuiz();
        const resultDisplay = document.getElementById('result-display');
        resultDisplay.style.display = "none";
    }

    // Initialize on load
    initQuiz();
</script>
