<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audience Insights Charts</title>
  <!-- amCharts 5 -->
  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/percent.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
  <style>
    body { background:#fff; color:#000; font-family: "Open Sans", sans-serif; height: 500px;}
    .chart { width: 100%; height: 250px; margin: 40px 0;}
    h2 { margin-top: 60px; text-align: center;}
    .container {position: relative; height: 500px; overflow-y: scroll; }
  </style>
</head>
<body>
  <div class="container">
<h2>Age Range</h2>
<div id="ageChart" class="chart"></div>

<h2>Gender</h2>
<div id="genderChart" class="chart"></div>

<h2>Household Income</h2>
<div id="incomeChart" class="chart"></div>

<h2>Education</h2>
<div id="educationChart" class="chart"></div>

<h2>Location</h2>
<div id="locationChart" class="chart"></div>

<h2>Purchase Motivation</h2>
<div id="motivationChart" class="chart"></div>

<h2>Usage Rate</h2>
<div id="usageChart" class="chart"></div>

<h2>Values: Sustainability Influence</h2>
<div id="valuesChart" class="chart"></div>
</div>
<script>
// Shared color palette (black, white + approved hex values)
const palette = [
  am5.color(0x000000), // black
  am5.color(0xD3473C),
  am5.color(0xFC9A0A),
  am5.color(0x3CA95C),
  am5.color(0x00A984),
  am5.color(0x2467B2),
  am5.color(0x553684)
];

function pieChart(divId, data) {
  let root = am5.Root.new(divId);
  root.setThemes([am5themes_Animated.new(root)]);

  let chart = root.container.children.push(
    am5percent.PieChart.new(root, { layout: root.verticalLayout })
  );

  let series = chart.series.push(
    am5percent.PieSeries.new(root, {
      valueField: "value",
      categoryField: "category"
    })
  );


series.slices.template.setAll({
  templateField: "sliceSettings"
});


  series.data.setAll(data);
  series.get("colors").set("colors", palette);

  series.labels.template.setAll({ fill: am5.color(0x000000) });
  series.ticks.template.setAll({ stroke: am5.color(0x000000) });
}

// AGE RANGE
pieChart("ageChart", [
  { category: "25–39", value: 52, sliceSettings: { fill: am5.color(0xD3473C), stroke: am5.color(0xFFFFFF), strokeWidth: 0} },
  { category: "40–54", value: 28, sliceSettings: { fill: am5.color(0x553684), stroke: am5.color(0xFFFFFF), strokeWidth: 0 } },
  { category: "18–24", value: 12, sliceSettings: { fill: am5.color(0x3CA95C), stroke: am5.color(0xFFFFFF), strokeWidth: 0 } },
  { category: "55+", value: 8, sliceSettings: { fill: am5.color(0x2467B2), stroke: am5.color(0xFFFFFF), strokeWidth: 0 } }
]);

// GENDER
pieChart("genderChart", [
  { category: "Women", value: 58, sliceSettings: { fill: am5.color(0xD3473C), stroke: am5.color(0xFFFFFF), strokeWidth: 0}  },
  { category: "Men", value: 39, sliceSettings: { fill: am5.color(0x553684), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  },
  { category: "Non-binary / Other", value: 3, sliceSettings: { fill: am5.color(0x3CA95C), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  }
]);

// HOUSEHOLD INCOME
pieChart("incomeChart", [
  { category: "$65k–$110k", value: 61, sliceSettings: { fill: am5.color(0xD3473C), stroke: am5.color(0xFFFFFF), strokeWidth: 0}  },
  { category: "Other income levels", value: 39, sliceSettings: { fill: am5.color(0x553684), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  }
]);

// EDUCATION
pieChart("educationChart", [
  { category: "College/University Degree", value: 67, sliceSettings: { fill: am5.color(0xD3473C), stroke: am5.color(0xFFFFFF), strokeWidth: 0}  },
  { category: "No Degree", value: 33, sliceSettings: { fill: am5.color(0x553684), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  }
]);

// LOCATION
pieChart("locationChart", [
  { category: "Urban", value: 44, sliceSettings: { fill: am5.color(0xD3473C), stroke: am5.color(0xFFFFFF), strokeWidth: 0}  },
  { category: "Suburban", value: 35, sliceSettings: { fill: am5.color(0x553684), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  },
  { category: "Rural", value: 21, sliceSettings: { fill: am5.color(0x3CA95C), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  }
]);

// PURCHASE MOTIVATION
pieChart("motivationChart", [
  { category: "Supporting Local Businesses", value: 48, sliceSettings: { fill: am5.color(0xD3473C), stroke: am5.color(0xFFFFFF), strokeWidth: 0}  },
  { category: "Discovery / Trying New Things", value: 31, sliceSettings: { fill: am5.color(0x553684), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  },
  { category: "Convenience", value: 21, sliceSettings: { fill: am5.color(0x3CA95C), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  }
]);

// USAGE RATE
pieChart("usageChart", [
  { category: "Daily", value: 70, sliceSettings: { fill: am5.color(0xD3473C), stroke: am5.color(0xFFFFFF), strokeWidth: 0}  },
  { category: "3–4x per Week", value: 22, sliceSettings: { fill: am5.color(0x553684), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  },
  { category: "Occasional", value: 8, sliceSettings: { fill: am5.color(0x3CA95C), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  }
]);

// VALUES: SUSTAINABILITY
pieChart("valuesChart", [
  { category: "Influenced by Sustainability", value: 74, sliceSettings: { fill: am5.color(0xD3473C), stroke: am5.color(0xFFFFFF), strokeWidth: 0}  },
  { category: "Not Influenced", value: 26, sliceSettings: { fill: am5.color(0x553684), stroke: am5.color(0xFFFFFF), strokeWidth: 0 }  }
]);
</script>

</body>
</html>
