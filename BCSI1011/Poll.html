<!DOCTYPE html>
<html>
<head>
  <title>Realtime Poll</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Inter", sans-serif; margin: 30px auto; width: 90%; }
    .option { margin: 10px 0; }
    button { padding: 8px 12px; width: 100%; text-align: left; font-size: 1rem; }
    .results { font-size: 1rem; color: #555; margin-top: 4px; }

    button#resetBtn {
      background: #d3473c;
      border: #d3473c;
      padding: 15px;
      text-align: center;
      color: #FFF;
      font-weight: 800;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

<h2 id="question"></h2>
<div id="poll"></div>

<button id="resetBtn">Reset Poll</button>


<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsh-Ddy_Ye72d5hqEinw42_X5tEO9ilR4",
  authDomain: "marketing-poll.firebaseapp.com",
  projectId: "marketing-poll",
  storageBucket: "marketing-poll.firebasestorage.app",
  messagingSenderId: "303346030261",
  appId: "1:303346030261:web:140040a8d2009d4e78d0fc",
  measurementId: "G-HW7GXM3S3F"
};

console.log("Script loaded");

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const pollRef = db.ref("poll");

  const pollDiv = document.getElementById("poll");
  const questionEl = document.getElementById("question");

  let userVote = localStorage.getItem("userVote");

  // Initialize poll if it doesn't exist
  pollRef.once("value").then(snapshot => {
    if (!snapshot.exists()) {
      pollRef.set({
        question: "Which statement about marketing do you most agree with?",
        options: {
          opt1: { text: "Marketing is just advertising", votes: 0 },
          opt2: { text: "Marketing is persuasion or manipulation", votes: 0 },
          opt3: { text: "Marketing only matters after a product is created", votes: 0 },
          opt4: { text: "Marketing does not meaningfully consider ethics", votes: 0 },
          opt5: { text: "Marketing is all about advertising", votes: 0 },
          opt6: { text: "Marketing is all about selling", votes: 0 },
          opt7: { text: "Marketing is all fluff and no substance", votes: 0 },
          opt8: { text: "Marketing is inherently unethical and harmful to society", votes: 0 },
          opt9: { text: "Only marketers market", votes: 0 },
          opt10:{ text: "Marketing is just another cost center in a firm", votes: 0 }
        }
      });
    }
  });

  function renderPoll(data) {
    pollDiv.innerHTML = "";
    questionEl.textContent = data.question;

    const options = data.options;

    const totalVotes = Object.values(options)
      .reduce((sum, o) => sum + o.votes, 0);

    Object.keys(options).forEach(key => {
      const opt = options[key];

      const div = document.createElement("div");
      div.className = "option";

      const button = document.createElement("button");
      button.textContent = opt.text;

      if (userVote) button.disabled = true;

      if (userVote === key) {
        button.style.background = "#4CAF50";
        button.style.color = "white";
      }

      button.onclick = () => vote(key);

      const percent = totalVotes
        ? ((opt.votes / totalVotes) * 100).toFixed(1)
        : 0;

      const results = document.createElement("div");
      results.className = "results";
      results.textContent = `Votes: ${opt.votes} (${percent}%)`;

      div.appendChild(button);
      div.appendChild(results);
      pollDiv.appendChild(div);
    });
  }

  function vote(optionKey) {
    if (userVote) return;

    const voteRef = db.ref(`poll/options/${optionKey}/votes`);

    voteRef.transaction(current => (current || 0) + 1);

    localStorage.setItem("userVote", optionKey);
    userVote = optionKey;
  }

  pollRef.on("value", snapshot => {
    const data = snapshot.val();
    if (data) renderPoll(data);
  });

  const ADMIN_PASSCODE = 'BCSIRESETMARKETPOLL';

const resetButton = document.getElementById("resetBtn");

resetButton.addEventListener('click', async () => {
  const entered = prompt('Enter admin passcode to reset responses:');
  if (entered !== ADMIN_PASSCODE) {
    alert('Incorrect passcode.');
    return;
  }

  try {
    const optionsRef = firebase.database().ref("poll/options");

    const snapshot = await optionsRef.once("value");

    const updates = {};

    snapshot.forEach(child => {
      updates[child.key + "/votes"] = 0;
    });

    await optionsRef.update(updates);

    localStorage.removeItem("userVote");

    alert('✅ Poll has been reset.');
  } catch (err) {
    console.error('❌ Reset failed:', err);
    alert('❌ Reset failed.');
  }
});
``
</script>

</body>
</html>
