<div id="quiz-container" style="font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; border: 2px solid #333; border-radius: 10px; background-color: #f9f9f9;">
    <h3 style="color: #2c3e50;">Art Education Quiz</h3>
    <p style="font-size: 1.1em; font-weight: bold;">What is the primary role of the teacher in an art program?</p>
    
    <div id="options">
        <label style="display: block; margin: 10px 0; cursor: pointer; padding: 10px; border: 1px solid #ccc; border-radius: 5px; transition: 0.3s;" onmouseover="this.style.backgroundColor='#e1e1e1'" onmouseout="this.style.backgroundColor='transparent'">
            <input type="radio" name="artRole" value="wrong1" style="margin-right: 10px;"> Instructor and Provider.
        </label>
        <label style="display: block; margin: 10px 0; cursor: pointer; padding: 10px; border: 1px solid #ccc; border-radius: 5px; transition: 0.3s;" onmouseover="this.style.backgroundColor='#e1e1e1'" onmouseout="this.style.backgroundColor='transparent'">
            <input type="radio" name="artRole" value="wrong2" style="margin-right: 10px;"> Facilitator and Caregiver.
        </label>
        <label style="display: block; margin: 10px 0; cursor: pointer; padding: 10px; border: 1px solid #ccc; border-radius: 5px; transition: 0.3s;" onmouseover="this.style.backgroundColor='#e1e1e1'" onmouseout="this.style.backgroundColor='transparent'">
            <input type="radio" name="artRole" value="correct" style="margin-right: 10px;"> Provider and Facilitator.
        </label>
        <label style="display: block; margin: 10px 0; cursor: pointer; padding: 10px; border: 1px solid #ccc; border-radius: 5px; transition: 0.3s;" onmouseover="this.style.backgroundColor='#e1e1e1'" onmouseout="this.style.backgroundColor='transparent'">
            <input type="radio" name="artRole" value="wrong3" style="margin-right: 10px;"> Caregiver and Instructor.
        </label>
    </div>

    <button onclick="checkAnswer()" style="margin-top: 15px; padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em;">Submit Answer</button>
    
    <div id="feedback" style="margin-top: 20px; font-weight: bold; display: none; padding: 10px; border-radius: 5px;"></div>
</div>

<script>
function checkAnswer() {
    const selected = document.querySelector('input[name="artRole"]:checked');
    const feedback = document.getElementById('feedback');
    
    if (!selected) {
        feedback.style.display = 'block';
        feedback.style.backgroundColor = '#ffeb3b';
        feedback.style.color = '#333';
        feedback.innerText = "Please select an answer!";
        return;
    }

    feedback.style.display = 'block';
    if (selected.value === 'correct') {
        feedback.style.backgroundColor = '#d4edda';
        feedback.style.color = '#155724';
        feedback.innerText = "Correct! In modern art education (like TAB), the teacher provides the environment/materials and facilitates the creative process.";
    } else {
        feedback.style.backgroundColor = '#f8d7da';
        feedback.style.color = '#721c24';
        feedback.innerText = "Incorrect. The primary role is typically defined as Provider and Facilitator.";
    }
}
</script>
