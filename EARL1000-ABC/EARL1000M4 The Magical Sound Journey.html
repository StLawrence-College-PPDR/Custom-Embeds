<div id="activity-wrapper">
    <div id="music-activity-container">
        <div class="activity-header">
            <h2>Facilitator Challenge: Music & Movement</h2>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <div id="game-screen">
            <div id="question-text" class="question-style"></div>
            <div id="options-grid"></div>
            <div id="feedback-area" class="hidden">
                <p id="feedback-text"></p>
                <button id="next-button" class="action-btn">Next Scenario →</button>
            </div>
        </div>

        <div id="completion-screen" class="hidden">
            <div class="success-icon">🌟</div>
            <h3>Activity Complete!</h3>
            <p>You have mastered the role of the musical facilitator. You can now recognize interest in onlookers, manage distractions by adjusting challenges, and ensure safety through proper planning.</p>
            <button onclick="resetActivity()" class="action-btn">Restart Activity</button>
        </div>
    </div>

    <style>
        #activity-wrapper {
            all: initial; /* Resets inherited styles from your website */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: block;
            width: 100%;
            padding: 20px 0;
            background-color: #f0f2f5;
        }

        #music-activity-container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .activity-header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .activity-header h2 {
            margin: 0 0 15px 0;
            font-size: 1.4rem;
            color: white;
        }

        .progress-container {
            background: rgba(255,255,255,0.3);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: #ffcc00;
            width: 0%;
            transition: width 0.4s ease;
        }

        #game-screen, #completion-screen {
            padding: 25px;
        }

        .question-style {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        #options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #4a90e2;
            color: #4a90e2;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: #eef6ff;
        }

        .option-btn.selected-correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option-btn.selected-incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        #feedback-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #4a90e2;
            background: #f9f9f9;
        }

        #feedback-area p {
            margin: 0 0 15px 0;
            color: #555;
            line-height: 1.5;
        }

        .action-btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .action-btn:hover {
            background: #357abd;
        }

        .hidden { display: none !important; }
        
        .success-icon {
            font-size: 50px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        #completion-screen { text-align: center; }
    </style>

    <script>
        const scenarios = [
            {
                question: "Role of the Adult: You have planned a music activity based on observation. What is your primary role during the session?",
                options: [
                    { text: "To act as a strict instructor making sure every child follows the beat.", correct: false },
                    { text: "To be a facilitator, having considered safety, personalities, and contingency plans.", correct: true }
                ],
                feedback: "Correct! As a facilitator, you have planned based on interests and abilities, ensuring a safe environment for all personalities."
            },
            {
                question: "Distractions: A child is repeatedly interrupting the group by shouting. What is your first consideration?",
                options: [
                    { text: "Is the activity too easy or too hard? They may be bored or in need of attention.", correct: true },
                    { text: "They are likely just being difficult and should be removed from the circle.", correct: false }
                ],
                feedback: "Exactly. Adjusting the challenge level can often re-engage a distracted child. Use props or special roles to keep them focused."
            },
            {
                question: "Safety: You want to lead a high-energy movement dance. Where should this happen?",
                options: [
                    { text: "In the quiet reading corner to encourage them to stay calm.", correct: false },
                    { text: "In a gym space or outside where there is enough room for safe movement.", correct: true }
                ],
                feedback: "Safety's sake! Always plan for enough space based on the type of movement planned."
            },
            {
                question: "Intervention: A quiet child is trying to suggest a song but is being drowned out by others. How do you help?",
                options: [
                    { text: "Ask the loud children: 'Did you hear what (Name) suggested? I didn't quite hear it.'", correct: true },
                    { text: "Tell the quiet child they need to speak up louder if they want to be heard.", correct: false }
                ],
                feedback: "Yes. Drawing the group's attention to the child helps them be successful and feel understood."
            },
            {
                question: "Supporting Interest: A child is watching the music from a distance but won't join the circle. How do you respond?",
                options: [
                    { text: "Remind them that 'active participation is required' to stay in the room.", correct: false },
                    { text: "Smile and say, 'We have room for more people,' acknowledging their onlooker interest.", correct: true }
                ],
                feedback: "Correct. Active participation is not required for a child to be interested. Watching from a distance is valid engagement!"
            }
        ];

        let currentStep = 0;

        function renderScenario() {
            const scenario = scenarios[currentStep];
            document.getElementById('question-text').innerText = scenario.question;
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            document.getElementById('feedback-area').classList.add('hidden');
            
            scenario.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(index, opt.correct);
                grid.appendChild(btn);
            });

            const progress = (currentStep / scenarios.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        function selectOption(index, isCorrect) {
            const btns = document.querySelectorAll('.option-btn');
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackText = document.getElementById('feedback-text');
            
            // Reset button styles
            btns.forEach(b => {
                b.classList.remove('selected-correct', 'selected-incorrect');
                b.disabled = true;
            });

            if (isCorrect) {
                btns[index].classList.add('selected-correct');
                feedbackText.innerText = scenarios[currentStep].feedback;
                feedbackArea.classList.remove('hidden');
            } else {
                btns[index].classList.add('selected-incorrect');
                feedbackText.innerText = "Not quite. Think about the facilitator's role in supporting individual needs and engagement. Try again!";
                feedbackArea.classList.remove('hidden');
                // Allow retry
                setTimeout(() => {
                    btns.forEach(b => b.disabled = false);
                }, 1500);
            }
        }

        document.getElementById('next-button').onclick = () => {
            currentStep++;
            if (currentStep < scenarios.length) {
                renderScenario();
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('completion-screen').classList.remove('hidden');
            }
        };

        function resetActivity() {
            currentStep = 0;
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('completion-screen').classList.add('hidden');
            renderScenario();
        }

        // Initialize
        renderScenario();
    </script>
</div>
