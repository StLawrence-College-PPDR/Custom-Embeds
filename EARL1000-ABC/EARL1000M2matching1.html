<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { background: white; width: 95vw; max-width: 850px; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { font-size: 18px; margin: 0 0 10px 0; text-align: center; color: #1a1a1a; }
        
        /* Books Tray */
        .tray-label { font-size: 12px; font-weight: bold; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .books-tray { display: flex; flex-wrap: wrap; gap: 6px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 15px; justify-content: center; }
        
        .book-card { background: #007bff; color: white; padding: 5px 10px; border-radius: 4px; cursor: grab; font-size: 12px; white-space: nowrap; transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-2px); background: #0056b3; }

        /* Skills Grid */
        .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        .drop-zone { background: #ffffff; border: 2px dashed #cbd5e0; border-radius: 8px; padding: 8px; min-height: 70px; display: flex; flex-direction: column; transition: 0.2s; }
        .drop-zone h4 { margin: 0; font-size: 13px; color: #2d3748; pointer-events: none; }
        .drop-zone p { margin: 2px 0; font-size: 10px; color: #718096; line-height: 1.2; pointer-events: none; }
        
        .drag-over { background: #edf2ff; border-color: #4c6ef5; }
        .correct { background: #ebfbee !important; border-color: #40c057 !important; border-style: solid; }
        
        .matched-book { background: #40c057; color: white; font-size: 11px; padding: 2px 6px; border-radius: 3px; margin-top: 5px; font-weight: bold; text-align: center; }

        #msg { text-align: center; height: 20px; font-size: 14px; margin-top: 10px; font-weight: bold; }
        .btn-reset { display: block; margin: 5px auto 0; font-size: 11px; padding: 4px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: white; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Cognitive Development & Literature</h2>
    
    <div class="tray-label">Drag Books to Skills:</div>
    <div id="books-source" class="books-tray"></div>

    <div class="skills-grid" id="grid">
        <!-- Generated by JS -->
    </div>

    <div id="msg"></div>
    <button class="btn-reset" onclick="location.reload()">Reset Activity</button>
</div>

<script>
    const data = [
        { t: "Where's Waldo?", s: "Observing", d: "Awareness of detail" },
        { t: "My First Colors", s: "Classifying", d: "Grouping & relationships" },
        { t: "Old Hat, New Hat", s: "Comparing", d: "Structured comparisons" },
        { t: "The Z Was Zapped", s: "Hypothesizing", d: "What if? & Predictions" },
        { t: "Charlie Needs a Cloak", s: "Organizing", d: "Sequencing & time" },
        { t: "Look at This", s: "Applying", d: "Practical application" },
        { t: "Lewis & Clark", s: "Summarizing", d: "Oral/Written sharing" },
        { t: "Dark & Full of Secrets", s: "Criticizing", d: "Evaluation & Analysis" },
        { t: "The Blanket", s: "Problem Solving", d: "Defining & resolving" }
    ];

    const tray = document.getElementById('books-source');
    const grid = document.getElementById('grid');
    const msg = document.getElementById('msg');

    // Create Drop Zones
    data.forEach(item => {
        const zone = document.createElement('div');
        zone.className = 'drop-zone';
        zone.dataset.skill = item.s;
        zone.innerHTML = `<h4>${item.s}</h4><p>${item.d}</p>`;
        
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', handleDrop);
        grid.appendChild(zone);
    });

    // Create Shuffled Books
    [...data].sort(() => Math.random() - 0.5).forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.draggable = true;
        card.innerText = item.t;
        card.id = 'b' + i;
        card.dataset.skill = item.s;
        card.addEventListener('dragstart', e => e.dataTransfer.setData('text', e.target.id));
        tray.appendChild(card);
    });

    function handleDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
        const bookId = e.dataTransfer.getData('text');
        const book = document.getElementById(bookId);
        
        if (this.dataset.skill === book.dataset.skill) {
            this.classList.add('correct');
            const tag = document.createElement('div');
            tag.className = 'matched-book';
            tag.innerText = book.innerText;
            this.appendChild(tag);
            book.style.visibility = 'hidden';
            msg.innerText = "Correct!";
            msg.style.color = "#40c057";
            checkWin();
        } else {
            msg.innerText = "Try again!";
            msg.style.color = "#e03131";
        }
    }

    function checkWin() {
        if (document.querySelectorAll('.matched-book').length === data.length) {
            msg.innerText = "🎉 All Matched Perfectly!";
        }
    }
</script>

</body>
</html>
