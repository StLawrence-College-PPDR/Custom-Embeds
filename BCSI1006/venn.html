<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Intersectionality Venn Diagram</title>

  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/venn.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }
    #chartdiv {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="chartdiv"></div>

<script>
am5.ready(function () {

  const root = am5.Root.new("chartdiv");
  root.setThemes([am5themes_Animated.new(root)]);

  const chart = root.container.children.push(
    am5venn.Venn.new(root, {})
  );

  const series = chart.series.push(
    am5venn.VennSeries.new(root, {
      categoryField: "name",
      valueField: "value"
    })
  );

  // ✅ DATA MUST INCLUDE INTERSECTIONS
  series.data.setAll([
    { name: "Race", value: 10 },
    { name: "Gender identity", value: 10 },
    { name: "Class", value: 10 },

    {
      name: "Race ∩ Gender",
      sets: ["Race", "Gender identity"],
      value: 5
    },
    {
      name: "Race ∩ Class",
      sets: ["Race", "Class"],
      value: 5
    },
    {
      name: "Gender ∩ Class",
      sets: ["Gender identity", "Class"],
      value: 5
    },
    {
      name: "All three",
      sets: ["Race", "Gender identity", "Class"],
      value: 3
    }
  ]);

});
</script>
</body>
</html>
