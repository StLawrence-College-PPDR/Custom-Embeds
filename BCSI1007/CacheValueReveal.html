<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cached Description with Word Minimum</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
    }

    p {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f9fafb;
      resize: vertical;
    }

  </style>
</head>
<body>

<p id="output1"></p>
<script>
  const cachedValue = localStorage.getItem("cached_description_min_20_words1");
  document.getElementById("output1").textContent =
    cachedValue ? cachedValue : "No Summary has been created.";
</script>
