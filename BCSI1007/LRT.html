
<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Ottawa LRT Line 1 — Custom Popup Map</title>
  <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
  <style>
    html, body { height: 500px; margin: 0px; }
    #map { position: absolute; inset: 0; margin: 0 auto; z-index: 1;}

    /* Optional: subtle tooltip styling (for permanent labels if you enable them) */
    .marker-label {
      background: rgba(255,255,255,0.9);
      color: #222;
      border: 1px solid #ccc;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
    }

    .popup-wrap { max-width: 320px; font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .popup-wrap h3 { margin: 0 0 .35rem; font-size: 15px; }
    .popup-wrap .note { color:#666; font-size:12px; margin-top:.35rem; }

    /* ─────────────────────────────────────────────────────────────
       Marker state styles (using CSS filters on default Leaflet pin)
       - visited: softer, persistent tint (after first open)
       - active : brighter tint while popup is open
       Adjust hue/saturation/brightness to taste.
       ───────────────────────────────────────────────────────────── */
    .leaflet-marker-icon.visited {
      filter: hue-rotate(150deg) saturate(1.3) brightness(1.05);
    }
    .leaflet-marker-icon.active {
      filter: hue-rotate(150deg) saturate(1.6) brightness(1.15) drop-shadow(0 1px 2px rgba(0,0,0,.35));
    }
    ul.map-button {
      list-style-type: none;
      padding: 0;

    }

    .popup-wrap {
          padding: 20px;
    }
    ul.map-button li a {
          display: block;
          background: #d84738;
          padding: 0.5rem;
          border-radius: 3px;
          color: #FFF;
          text-decoration: none;
          font-weight: 500;
          text-align: center;
    }
    ul.map-button li a:hover {
          background: rgb(197 86 75);
          transition: cubic-bezier(x1, y1, x2, y2);
    }

    /* Base pin */
    .pin {
      width: 25px;
      height: 25px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-90deg);
      position: relative;
      background: #333333;      /* default gray */
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
    }

    /* Visited state = red */
    .pin.visited {
      background: #d84738;
    }

    /* A subtle hover */
    .pin:hover { filter: brightness(1.05); }

    /* Make the click target a bit larger while keeping the look the same */
    .pin-wrap {
      width: 26px;
      height: 26px;
      transform: rotate(45deg); /* undo pin's rotate for better hitbox */
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <div id='map'></div>
  <script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
  <script>
    const stations = [
    {
      "name": "Tunney's Pasture",
     "coords": [45.40389, -75.735], "title": "Tunney's Pasture \u2014 Western Terminus",
     "desc": "Western end of Line 1 serving the federal Tunney's Pasture campus.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Tunney%27s_Pasture_station"
    },
    {"name": "Bayview",
     "coords": [45.40944, -75.72194], "title": "Bayview \u2014 Transfer to Line 2",
     "desc": "Major interchange linking Line 1 and Line 2, near Hintonburg/Little Italy.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Bayview_station_(Ottawa)"
    },
    {"name": "Pimisi",
     "coords": [45.41389, -75.71333], "title": "Pimisi \u2014 LeBreton Flats",
     "desc": "Gateway to LeBreton Flats and Canadian War Museum; Algonquin-inspired art.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Pimisi_station"
    },
    {"name": "Lyon",
     "coords": [45.41944, -75.70444], "title": "Lyon \u2014 Downtown West",
     "desc": "Underground station with entrances into Place de Ville complex.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Lyon_station"
    },
    {"name": "Parliament",
     "coords": [45.42139, -75.69889], "title": "Parliament \u2014 Business District",
     "desc": "High\u2011usage downtown stop with access to Parliament Hill and Sparks Street.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Parliament_station"
    },
    {"name": "Rideau",
     "coords": [45.42611, -75.69194], "title": "Rideau \u2014 ByWard Market",
     "desc": "Deepest station on the network; direct access to Rideau Centre and Market.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Rideau_station"
    },
    {"name": "uOttawa",
     "coords": [45.42056, -75.68222], "title": "uOttawa \u2014 Campus Station",
     "desc": "At\u2011grade stop serving the University of Ottawa and Corktown Footbridge.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/UOttawa_station"
    },
    {"name": "Lees",
     "coords": [45.41639, -75.67028], "title": "Lees \u2014 Sandy Hill Heights",
     "desc": "Serves Lees Ave area; side\u2011platform station in a trench.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Lees_station"
    },
    {"name": "Hurdman",
     "coords": [45.41222, -75.66278], "title": "Hurdman \u2014 Major Hub",
     "desc": "Key transfer point between LRT and Transitway routes near Rideau River.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Hurdman_station"
    },
    {"name": "Tremblay",
     "coords": [45.41667, -75.65333], "title": "Tremblay \u2014 VIA Rail Link",
     "desc": "Short walk to Ottawa (VIA Rail) intercity station via Tremblay Road plaza.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Tremblay_station"
    },
    {"name": "Blair",
     "coords": [45.43111, -75.60833], "title": "Blair \u2014 Eastern Terminus",
     "desc": "Eastern end of Line 1; transfers to buses for Gloucester and Orl\u00e9ans.",
     "link_text": "Station details (Wikipedia)",
     "href": "https://en.wikipedia.org/wiki/Blair_station"}];

    const map = L.map('map');
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
}).addTo(map);

    const coords = stations.map(s => s.coords);
    L.polyline(coords, { 

color: '#333333',
  weight: 5,
  opacity: 0.9,
  dashArray: '8 6',    // 8px dash, 6px gap
  dashOffset: '0',     // (optional) shift the pattern along the path
  lineCap: 'butt'      // (optional) 'butt' = squared off dashes (looks cleaner)

    }).addTo(map);

    map.fitBounds(L.latLngBounds(coords).pad(0.08));

    // Restore visited station ids from localStorage
const VISITED_KEY = 'ottawa_lrt_line1_visited';
const visitedSet = new Set(JSON.parse(localStorage.getItem(VISITED_KEY) || '[]'));

function saveVisited() {
  localStorage.setItem(VISITED_KEY, JSON.stringify(Array.from(visitedSet)));
}

// Helper to build a colored DivIcon for each station
function buildPinIcon(isVisited) {
  return L.divIcon({
    className: '',         // we'll provide our own DOM
    html: `<div class="pin-wrap"><div class="pin ${isVisited ? 'visited' : ''}"></div></div>`,
    iconSize: [300, 200],
    iconAnchor: [13, 26],  // tip of the pin sits on the coordinate
    popupAnchor: [0, -26]
  });
}

stations.forEach((s, i) => {
  const id = `${i}-${s.name}`;           // simple stable id
  const isVisited = visitedSet.has(id);

  const marker = L.marker(s.coords, {
    icon: buildPinIcon(isVisited)
  }).addTo(map);

  // Build the popup HTML (unchanged from your file)
  const html = `
    <div class="popup-wrap">
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <ul class="map-button"><li><a href="${s.href}" target="_blank" rel="noopener">${s.link_text}</a></li></ul>
    </div>`;

  marker.bindPopup(html);

  // When the popup opens (or on click), mark as visited
  marker.on('popupopen', () => {
    // Mark only once
    if (!visitedSet.has(id)) {
      visitedSet.add(id);
      saveVisited();
      // Swap the icon to visited version
      marker.setIcon(buildPinIcon(true));
    }
  });

  // Optional: also mark on direct marker click, even before popup loads
  marker.on('click', () => {
    if (!visitedSet.has(id)) {
      visitedSet.add(id);
      saveVisited();
      marker.setIcon(buildPinIcon(true));
    }
  });
});

  </script>
</body>
</html>
