      function getColor(val) {
        if (val > 650000) return am5.color(0x7a0177);
        if (val > 500000) return am5.color(0xc51b8a);
        if (val > 400000) return am5.color(0xf768a1);
        if (val > 300000) return am5.color(0xfbb4b9);
        return am5.color(0xfde0dd);
      }

      // ---- POINT SERIES ----
      var pointSeries = chart.series.push(
        am5map.MapPointSeries.new(root, {
          geoJSON: {
            type: "FeatureCollection",
            features: cityData.map(d => ({
              type: "Feature",
              geometry: d.geometry,
              properties: d
            }))
          }
        })
      );

      pointSeries.bullets.push(function (root, series, dataItem) {
        var d = dataItem.dataContext;

        var radius = Math.sqrt(d.pop) / 40;

        return am5.Bullet.new(root, {
          sprite: am5.Circle.new(root, {
            radius: radius,
            fill: getColor(d.value),
            fillOpacity: 0.75,
            strokeOpacity: 0,
            strokeWidth: 0,
            tooltipText:
              "[bold]{city}[/]\nPopulation: {pop.formatNumber('#,###')}\nMedian Value: ${value.formatNumber('#,###')}"
          })
        });
      });

      // ---- LEGEND (AUTO-SCALE) ----
      var minMedian = Infinity;
      var maxMedian = -Infinity;

      cityData.forEach(function (d) {
        var value = Number(d.value);
        if (value < minMedian) minMedian = value;
        if (value > maxMedian) maxMedian = value;
      });

      var legendContainer = chart.children.push(
        am5.Container.new(root, {
          layout: root.verticalLayout,
          x: am5.p50,
          centerX: am5.p50,
          y: am5.p95,
          centerY: am5.p95,
          width: am5.percent(80)
        })
      );

      var heatLegend = legendContainer.children.push(
        am5.HeatLegend.new(root, {
          orientation: "horizontal",
          startColor: am5.color(0xfde0dd),
          endColor: am5.color(0x7a0177),
          startValue: minMedian,
          endValue: maxMedian,
          minValue: minMedian,
          maxValue: maxMedian,
          height: 30,
          paddingTop: 10,
          paddingBottom: 10
        })
      );

      heatLegend.valueLabels.template.setAll({
        fontSize: 12,
        fill: am5.color(0x000000)
      });

      var tickCount = 5;
      var tickContainer = legendContainer.children.push(
        am5.Container.new(root, {
          layout: root.horizontalLayout,
          paddingTop: 5
        })
      );

      for (var i = 0; i < tickCount; i++) {
        var value = minMedian + (i * (maxMedian - minMedian) / (tickCount - 1));
        tickContainer.children.push(
          am5.Label.new(root, {
            text: "$" + Math.round(value / 1000) + "K",
            fontSize: 12,
            fill: am5.color(0x000000)
          })
        );
