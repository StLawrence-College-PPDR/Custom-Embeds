<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vancover Po</title>

  <!-- deck.gl and MapLibre dependencies -->
  <script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <link
    href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .deck-tooltip {
      font-family: Arial, sans-serif;
      padding: 6px !important;
      margin: 8px;
      max-width: 300px;
      font-size: 10px;
    }

    /* Legend styling */
    .legend {
  position: absolute;
  right: 10px;
  top: 10px;
  z-index: 9999;
  padding: 10px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 6px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  line-height: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}


    .legend-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
    }

    .legend-color {
      width: 18px;
      height: 12px;
      margin-right: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>
<div class="legend" id="legend">
  <div class="legend-title">Vancouver Property Value</div>
  <p>The property value of Vancouver, BC</p>
  <p>Height of polygons - average property value per square meter of lot.</p>
  <p>Color - value growth from last assessment.</p>
  <p>Data source: <a href="http://data.vancouver.ca/">City of Vancouver</a></p>
</div>

<script type="text/javascript">

  const {DeckGL, GeoJsonLayer} = deck;

  const COLOR_SCALE = [
    [65, 182, 196],
    [127, 205, 187],
    [199, 233, 180],
    [237, 248, 177],
    [255, 255, 204],
    [255, 237, 160],
    [254, 217, 118],
    [254, 178, 76],
    [253, 141, 60],
    [252, 78, 42],
    [227, 26, 28],
    [189, 0, 38],
    [128, 0, 38]
  ];

  const geojsonLayer = new GeoJsonLayer({
    id: "geojson-polygons",
    data: "https://raw.githubusercontent.com/visgl/deck.gl-data/master/examples/geojson/vancouver-blocks.json",
    opacity: 0.8,
    stroked: false,
    filled: true,
    extruded: true,
    wireframe: true,
    pickable: true,

    getElevation: f => Math.sqrt(f.properties.valuePerSqm) * 10,
    getFillColor: f => colorScale(f.properties.growth),
    getLineColor: [255, 255, 255]
  });

  // Initialize DeckGL
  new DeckGL({
    mapStyle: "https://basemaps.cartocdn.com/gl/positron-nolabels-gl-style/style.json",
    initialViewState: {
      latitude: 49.254,
      longitude: -123.13,
      zoom: 11,
      maxZoom: 16,
      pitch: 45
    },
    controller: true,
    layers: [geojsonLayer],
    getTooltip
  });

  function colorScale(x) {
    const i = Math.round(x * 7) + 4;
    if (x < 0) {
      return COLOR_SCALE[i] || COLOR_SCALE[0];
    }
    return COLOR_SCALE[i] || COLOR_SCALE[COLOR_SCALE.length - 1];
  }

  function getTooltip({object}) {
    return object && `
Property Value:
  ${object.properties.valuePerSqm} per m²
Growth:
  ${Math.round(object.properties.growth * 100)}%`;
  }

  // --- LEGEND ---
  const legend = document.getElementById("legend");

  // Define legend breaks (approximate)
  const breaks = [
    "< -4%",
    "-4% to -2%",
    "-2% to 0%",
    "0% to 2%",
    "2% to 4%",
    "4% to 6%",
    "6% to 8%",
    "8% to 10%",
    "10% to 12%",
    "12% to 14%",
    "14% to 16%",
    "> 16%"
  ];

  for (let i = 0; i < breaks.length; i++) {
    const row = document.createElement("div");
    row.className = "legend-row";

    const color = document.createElement("div");
    color.className = "legend-color";
    color.style.background = `rgb(${COLOR_SCALE[i].join(",")})`;

    const label = document.createElement("div");
    label.textContent = breaks[i];

    row.appendChild(color);
    row.appendChild(label);
    legend.appendChild(row);
  }

</script>
</body>
</html>
