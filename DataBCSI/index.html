<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canada Housing Bubble Map with Slider</title>
<style>
  html, body, #chartdiv {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
  }
  #sliderContainer {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    text-align: center;
    font-family: Arial, sans-serif;
  }
  #sliderLabel {
    margin-bottom: 5px;
  }
</style>

<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/map.js"></script>
<script src="https://cdn.amcharts.com/lib/5/geodata/canadaLow.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
</head>
<body>

<div id="chartdiv"></div>
<div id="sliderContainer">
  <div id="sliderLabel">Median Value ≥ $300,000</div>
  <input type="range" id="valueSlider" min="0" max="1000000" step="10000" value="300000">
</div>

<script>
am5.ready(function() {

  var root = am5.Root.new("chartdiv");
  root.setThemes([am5themes_Animated.new(root)]);

  var chart = root.container.children.push(
    am5map.MapChart.new(root, {
      projection: am5map.geoMercator(),
      homeGeoPoint: { latitude: 56, longitude: -96 },
      homeZoomLevel: 3,
      maxZoomLevel: 10
    })
  );

  // --- Canada provinces ---
  var polygonSeries = chart.series.push(
    am5map.MapPolygonSeries.new(root, {
      geoJSON: am5geodata_canadaLow
    })
  );

  polygonSeries.mapPolygons.template.setAll({
    fill: am5.color(0xe5e5e5),
    stroke: am5.color(0xffffff)
  });

  // --- City data ---
  var allCityData = [
    { city: "Toronto", lat: 43.65, lon: -79.38, pop: 2731571, value: 647648 },
    { city: "Vancouver", lat: 49.28, lon: -123.12, pop: 2463431, value: 800220 },
    { city: "Ottawa–Gatineau", lat: 45.42, lon: -75.70, pop: 1323783, value: 349818 },
    { city: "Calgary", lat: 51.05, lon: -114.07, pop: 1392609, value: 450406 },
    { city: "Montreal", lat: 45.50, lon: -73.57, pop: 1704694, value: 300794 },
    { city: "Edmonton", lat: 53.55, lon: -113.49, pop: 1321426, value: 399932 },
    { city: "Halifax", lat: 44.65, lon: -63.57, pop: 403390, value: 269126 },
    { city: "Winnipeg", lat: 49.90, lon: -97.14, pop: 778489, value: 299614 },
    { city: "Victoria", lat: 48.43, lon: -123.37, pop: 369780, value: 590424 },
    { city: "Saskatoon", lat: 52.13, lon: -106.67, pop: 260600, value: 350148 },
    { city: "Regina", lat: 50.45, lon: -104.61, pop: 236481, value: 348426 }
  ];

  // --- Color function ---
  function getColor(value) {
    if (value > 650000) return am5.color(0x7a0177);
    if (value > 500000) return am5.color(0xc51b8a);
    if (value > 400000) return am5.color(0xf768a1);
    if (value > 300000) return am5.color(0xfbb4b9);
    return am5.color(0xfde0dd);
  }

  // --- Point series (create first with initial filtered data) ---
  var initialValue = 300000;
  var pointSeries = chart.series.push(
    am5map.MapPointSeries.new(root, {
      latitudeField: "lat",
      longitudeField: "lon",
      data: allCityData.filter(d => d.value >= initialValue)
    })
  );

  // --- Bullet template (create once) ---
  pointSeries.bullets.push(function(root, series, dataItem) {
    var radius = Math.sqrt(dataItem.dataContext.pop) / 120;

    var circle = am5.Circle.new(root, {
      radius: radius,
      fill: getColor(dataItem.dataContext.value),
      fillOpacity: 0.75,
      stroke: am5.color(0x333333),
      strokeOpacity: 0.6,
      tooltipText: "[bold]{city}[/]\nPopulation: {pop.formatNumber('#,###')}\nMedian Value: ${value.formatNumber('#,###')}"
    });

    var label = am5.Label.new(root, {
      text: dataItem.dataContext.city,
      centerX: am5.p50,
      y: -radius - 5,
      fontSize: 11
    });

    var container = am5.Container.new(root, { children: [circle, label] });

    return am5.Bullet.new(root, { sprite: container });
  });

  // --- Slider to filter data ---
  var slider = document.getElementById("valueSlider");
  var sliderLabel = document.getElementById("sliderLabel");

  slider.addEventListener("input", function() {
    var val = parseInt(this.value);
    sliderLabel.innerHTML = "Median Value ≥ $" + val.toLocaleString();
    pointSeries.data.setAll(allCityData.filter(d => d.value >= val));
  });

  // --- Legend ---
  var legend = chart.children.push(
    am5.Legend.new(root, {
      x: am5.percent(100),
      centerY: am5.percent(50),
      y: am5.percent(50),
      layout: root.verticalLayout
    })
  );

  legend.data.setAll([
    { name: "> $650k", fill: am5.color(0x7a0177) },
    { name: "$500k – $650k", fill: am5.color(0xc51b8a) },
    { name: "$400k – $500k", fill: am5.color(0xf768a1) },
    { name: "$300k – $400k", fill: am5.color(0xfbb4b9) },
    { name: "< $300k", fill: am5.color(0xfde0dd) }
  ]);
  legend.markers.template.setAll({ width: 18, height: 18, cornerRadius: 3 });

});
</script>
</body>
</html>
