<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Canada Capitals 2021 - deck.gl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@8.10.0/dist.min.js"></script>

  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    #tooltip {
      position:absolute;
      z-index:10;
      pointer-events:none;
      background:rgba(0,0,0,0.75);
      color:#fff;
      padding:8px;
      border-radius:4px;
      font-size:14px;
      display:none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="tooltip"></div>

  <script>
    // 2021 capital populations
    const capitalPop2021 = {
      "Toronto": 2794356,
      "Ottawa": 1017449,
      "Quebec City": 549459,
      "Victoria": 91867,
      "Edmonton": 1010899,
      "Winnipeg": 749607,
      "Regina": 226404,
      "Halifax": 348634,
      "Fredericton": 63116,
      "Charlottetown": 40500,
      "St. John's": 205995,
      "Whitehorse": 25000,
      "Yellowknife": 20000,
      "Iqaluit": 7429
    };

    const maxPop = Math.max(...Object.values(capitalPop2021));
    const minPop = Math.min(...Object.values(capitalPop2021));

    function scaleElevation(pop) {
      const minHeight = 10000;
      const maxHeight = 400000;
      return ((pop - minPop) / (maxPop - minPop)) * (maxHeight - minHeight) + minHeight;
    }

    function scaleColor(pop) {
      const ratio = (pop - minPop) / (maxPop - minPop);
      const r = Math.floor(255 * ratio);
      const g = Math.floor(255 * (1 - ratio));
      return [r, g, 100, 180];
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://demotiles.maplibre.org/style.json',
      center: [-95, 60],
      zoom: 3
    });

    const deckOverlay = new deck.DeckGL({
      canvas: 'deck-canvas',
      width: '100%',
      height: '100%',
      initialViewState: {
        longitude: -95,
        latitude: 60,
        zoom: 3,
        pitch: 45,
        bearing: 0
      },
      controller: true
    });

    // Load the simplified GeoJSON file
    fetch("canada_provinces_simplified.geojson")
      .then(r => r.json())
      .then(data => {
        const geoJsonLayer = new deck.GeoJsonLayer({
          id: "canada-provinces",
          data: data,
          pickable: true,
          stroked: true,
          filled: true,
          extruded: true,
          wireframe: true,
          getElevation: f => scaleElevation(capitalPop2021[f.properties.capital]),
          getFillColor: f => scaleColor(capitalPop2021[f.properties.capital]),
          getLineColor: [0, 0, 0, 180],
          onHover: ({ object, x, y }) => {
            const tooltip = document.getElementById('tooltip');
            if (object) {
              const pop = capitalPop2021[object.properties.capital];
              tooltip.style.display = 'block';
              tooltip.style.left = x + 'px';
              tooltip.style.top = y + 'px';
              tooltip.innerHTML = `
                <strong>${object.properties.name}</strong><br/>
                Capital: ${object.properties.capital}<br/>
                Population (2021): ${pop.toLocaleString()}
              `;
            } else {
              tooltip.style.display = 'none';
            }
          }
        });

        deckOverlay.setProps({ layers: [geoJsonLayer] });
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
